name: CI
on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Agent CLI smoke test
        run: |
          npm run agent -- --help
          npm run agent -- status
      - name: Database migration smoke test
        run: npm run db:migrate
      - name: Run unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build